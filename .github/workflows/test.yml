name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Contended 20-process gate (G-01-2): pinned to 2 CPUs, 40 trials per scenario, on all four jobs.
      # Also POSIX O_APPEND evidence for the concurrency gate (research A3) on ubuntu.
      - run: npm run test:stress
